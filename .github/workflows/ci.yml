name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: Quickstart (the commands the README documents)
        run: |
          # challenge exits 1 on the sample session: one row cannot be re-derived.
          recallproof challenge --session examples/session.jsonl --memory examples/memory_rows.jsonl || test $? -eq 1
          recallproof index --session examples/session.jsonl --memory examples/memory_rows.jsonl --out /tmp/pointers.jsonl
          recallproof rederive row_0001 --session examples/session.jsonl --memory examples/memory_rows.jsonl --pointers /tmp/pointers.jsonl
          python -m recallproof.spike --fixture
