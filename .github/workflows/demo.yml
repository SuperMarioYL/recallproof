name: demo

# Manual only. The committed assets/demo.svg is the source of truth — this job
# re-records it from a real run when the tool's output changes on purpose, so a
# rendering hiccup can never fail a release.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Record assets/demo.svg from a real run
        run: python scripts/record_demo_svg.py
      - name: Commit if the recording changed
        run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add assets/demo.svg
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "chore: re-record demo svg"
          git push origin HEAD:${{ github.ref_name }}
