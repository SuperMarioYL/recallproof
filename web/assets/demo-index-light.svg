<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d" data-palette="c7e656-89e76a-f6ebac-0a53b4183f53">
<title id="t">index 写出的旁路指针索引（记录步骤 2）</title><desc id="d">Recorded index step: one pointer record per row, source_ref null when nothing could be pinned.</desc>
<style>
  :root{--bg:#fdfef9;--panel:#fcfef7;--code:#fbfdf3;--ink:#232a1c;--muted:#6a7869;
    --line:#eef7cb;--primary:#6b7b2e;--secondary:#4d813b;--highlight:#7b7556;}
  text{font-family:'Space Grotesk', -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;}
  .kicker{fill:var(--muted);font-size:12px;font-weight:700;letter-spacing:1.7px;}
  .name{fill:var(--ink);font-size:46px;font-weight:700;letter-spacing:-.6px;}
  .sub{fill:var(--muted);font-size:19px;}
  .h{fill:var(--ink);font-size:15px;font-weight:700;}
  .t{fill:var(--ink);font-size:14px;}
  .m{fill:var(--muted);font-size:12.5px;}
  .mono{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace;font-size:12.5px;fill:var(--ink);}
  .chip{font-size:11px;font-weight:700;letter-spacing:.7px;}
  .card{fill:var(--panel);stroke:var(--line);stroke-width:1.2;}
  .card-accent{fill:var(--panel);stroke:var(--primary);stroke-width:1.6;}
  .card-dashed{fill:var(--panel);stroke:var(--muted);stroke-width:1.2;stroke-dasharray:6 5;}
  .wire{stroke:var(--line);stroke-width:1.5;fill:none;}
  .wire-strong{stroke:var(--primary);stroke-width:1.7;fill:none;opacity:.85;}
  .particle{fill:var(--primary);}
  .particle-alt{fill:var(--secondary);}
  .pulse{animation:travel 3.8s linear infinite;}
  .pulse-slow{animation:travel 6s linear infinite;}
  .breathe{animation:breathe 5s ease-in-out infinite;}
  .crawl{stroke-dasharray:5 7;animation:crawl 2.6s linear infinite;}
  .drift{animation:drift 7s ease-in-out infinite alternate;}
  @keyframes travel{0%{transform:translate(var(--x0),var(--y0));opacity:0}
    15%{opacity:1}85%{opacity:1}100%{transform:translate(var(--x1),var(--y1));opacity:0}}
  @keyframes breathe{0%,100%{opacity:.28}50%{opacity:.72}}
  @keyframes crawl{to{stroke-dashoffset:-24}}
  @keyframes drift{from{opacity:.35}to{opacity:.9}}
  @media (prefers-reduced-motion:reduce){.pulse,.pulse-slow,.breathe,.crawl,.drift{animation:none}
    .breathe{opacity:.5}.pulse,.pulse-slow{opacity:.9}}</style>
<rect x="0" y="0" width="760" height="300" rx="18" fill="#fdfef9"/>
<rect x="0" y="0" width="760" height="300" rx="18" fill="#fdfef9"/><text x="24" y="38" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="start" opacity="1">recallproof index</text>
<text x="24" y="58" font-family="'Space Grotesk', -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="var(--muted)" text-anchor="start" opacity="1">the sidecar index, one JSON object per row — the store itself is never opened</text>
<rect class="card-accent" x="24" y="76" width="712" height="106" rx="10"/>
<text x="42" y="102" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12" fill="var(--ink)" text-anchor="start" opacity="1">{&quot;row_id&quot;: &quot;row_0001&quot;, &quot;source_ref&quot;: {</text>
<text x="58" y="124" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12" fill="var(--muted)" text-anchor="start" opacity="1">&quot;line_index&quot;: 2, &quot;block_index&quot;: 1, &quot;span&quot;: [109, 202],</text>
<text x="58" y="146" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12" fill="var(--muted)" text-anchor="start" opacity="1">&quot;event_sha256&quot;: &quot;981858fb…&quot;, &quot;derivation&quot;: &quot;extractive&quot;}}</text>
<text x="42" y="170" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12" fill="var(--secondary)" text-anchor="start" opacity="1">{&quot;row_id&quot;: &quot;row_0002&quot;, &quot;source_ref&quot;: null}</text>
<rect class="card" x="24" y="194" width="712" height="42" rx="10"/>
<text x="42" y="220" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12" fill="var(--highlight)" text-anchor="start" opacity="1">{&quot;row_id&quot;: &quot;row_0003&quot;, &quot;source_ref&quot;: null}   ← abstractive: never pinned</text>
<text x="24" y="268" font-family="'Space Grotesk', -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="var(--primary)" font-weight="700" text-anchor="start" opacity="1">3 rows indexed — 1 pinned, 2 unpinned → examples/pointers.jsonl</text>
<text x="24" y="288" font-family="'Space Grotesk', -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="var(--muted)" text-anchor="start" opacity="1">nothing is annotated in place; no memory store is written</text>
</svg>
